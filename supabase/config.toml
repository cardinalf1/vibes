# Supabase configuration for Isha Vibes
project_id = "isha-vibes"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://vibes.cardinalsystems.org"
additional_redirect_urls = ["https://vibes.cardinalsystems.org", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[realtime]
enabled = true
port = 54324
